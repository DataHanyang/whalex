appId: app.whalex.desktop
productName: Whalex
electronVersion: 33.4.11
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/@vscode/ripgrep/**"
  - "**/node_modules/@nut-tree-fork/**"
win:
  target:
    - nsis
  icon: build/icon.png
  # 코드 서명: 인증서가 있으면(WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD env 또는
  # azureSignOptions) electron-builder가 자동 서명. 없으면 미서명 빌드를 위해
  # signAndEditExecutable을 false로 두어 rcedit/winCodeSign 심링크 이슈 회피.
  #
  # 권장(1.0): Azure Trusted Signing (~$10/월, 즉시 SmartScreen 신뢰)
  # azureSignOptions:
  #   publisherName: "<Your Org>"
  #   endpoint: "https://eus.codesigning.azure.net"
  #   codeSigningAccountName: "<account>"
  #   certificateProfileName: "<profile>"
  signAndEditExecutable: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # notarize: Apple Developer($99/yr) 필요. APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
  # APPLE_TEAM_ID env가 있으면 electron-builder가 자동 공증.
  # notarize: true
linux:
  target:
    - AppImage
  category: Development
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Whalex
  deleteAppDataOnUninstall: false
# 자동 업데이트 피드 (OSS 에디션). 저장소 공개 시 owner/repo 채우고 주석 해제.
# publish:
#   provider: github
#   owner: <github-owner>
#   repo: whalex
