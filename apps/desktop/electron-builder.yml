appId: app.whalex.desktop
productName: WhaleX
electronVersion: 33.4.11
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/@vscode/ripgrep/**"
  - "**/node_modules/@nut-tree-fork/**"
# Code signing: with a certificate (WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD env or
# azureSignOptions) electron-builder signs automatically. Without one we keep
# signAndEditExecutable false to avoid rcedit/winCodeSign symlink issues on CI.
win:
  target:
    - nsis
  icon: build/icon.png
  #
  # azureSignOptions:
  #   publisherName: "<Your Org>"
  #   endpoint: "https://eus.codesigning.azure.net"
  #   codeSigningAccountName: "<account>"
  #   certificateProfileName: "<profile>"
  signAndEditExecutable: false
mac:
  # zip is the reliable unsigned CI artifact; add dmg once a signing identity
  # (Apple Developer cert) is available, otherwise it fails on the runner.
  # Both arches are built explicitly: the runner is Apple Silicon, so without
  # x64 listed here Intel Macs get no artifact at all.
  target:
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # notarize: true
linux:
  # AppImage is the universal single-file build; add deb when fpm metadata
  # and tooling are set up on the runner.
  target:
    - AppImage
  category: Development
  icon: build/icon.png
  maintainer: WhaleX
nsis:
  oneClick: true
  perMachine: false
  shortcutName: WhaleX
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: leejoong
  repo: whalex
