appId: app.whalex.desktop
productName: Whalex
electronVersion: 33.4.11
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/@vscode/ripgrep/**"
win:
  target:
    - nsis
  icon: build/icon.png
  # 미서명 v0.x 빌드: rcedit/서명 단계를 생략해 winCodeSign 심링크 이슈 회피.
  # 코드 서명 도입 시(1.0) 제거하고 Azure Trusted Signing 설정 추가.
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Whalex
  deleteAppDataOnUninstall: false
# publish: GitHub Releases 연결은 저장소 공개 시 활성화
# publish:
#   provider: github
#   owner: <github-owner>
#   repo: whalex
