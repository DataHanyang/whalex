name: Release

# Tag a version (e.g. v0.2.0) to build installers for all platforms and
# publish them as a DRAFT GitHub Release. Review + smoke test, then publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fail fast if the tag doesn't match the app version — otherwise the
  # auto-updater metadata and installer filenames disagree with the tag.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches apps/desktop/package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $PKG_VERSION"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version is auto-detected from the packageManager field in package.json
      # (passing a version input as well causes a "Multiple versions of pnpm" conflict).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.electron.outputs.version }}

      - name: Cache Electron binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ steps.electron.outputs.version }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r typecheck
      - run: pnpm --filter @whalex/core test

      # Build + publish installers to a draft release (unsigned).
      #
      # To sign later, add a dedicated signed step guarded by the secret so the
      # CSC_* vars are never set to empty strings (electron-builder treats an
      # empty CSC_LINK as a missing cert file and fails with "… not a file"):
      #   Windows: WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (or Azure Trusted Signing)
      #   macOS:   CSC_LINK / CSC_KEY_PASSWORD + APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
      - name: Build & publish
        working-directory: apps/desktop
        run: pnpm dist --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing identity on the runner → don't attempt to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Once every platform has uploaded its installers to the draft release,
  # attach a SHA256SUMS.txt covering all assets.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir assets
          cd assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
