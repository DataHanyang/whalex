name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version is auto-detected from the packageManager field in package.json
      # (passing a version input as well causes a "Multiple versions of pnpm" conflict).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r typecheck
      # Build the Electron app too — a renderer/electron-vite break must fail CI,
      # not surface for the first time on a release tag.
      - run: pnpm --filter @whalex/desktop build
      - run: pnpm --filter @whalex/core test
