<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Earth — Realtime 3D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000005;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #gl { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #gl.dragging { cursor: grabbing; }

  #hud {
    position: fixed; left: 24px; bottom: 22px;
    color: rgba(216, 232, 255, .62);
    font-size: 12px; letter-spacing: .08em;
    line-height: 1.7; text-transform: uppercase;
    pointer-events: none; user-select: none;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
  }
  #hud b {
    display: block; font-size: 15px; font-weight: 600;
    letter-spacing: .22em; color: rgba(233, 243, 255, .92);
    margin-bottom: 6px;
  }
  #hud span { opacity: .74; }
  #hud kbd {
    font: inherit; letter-spacing: .06em;
    color: rgba(150, 200, 255, .95);
  }

  #stats {
    position: fixed; right: 24px; bottom: 22px;
    color: rgba(216, 232, 255, .40);
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    pointer-events: none; user-select: none; text-align: right;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
  }

  #loader {
    position: fixed; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #000005; z-index: 10;
    transition: opacity .8s ease;
    color: rgba(220, 235, 255, .8);
    font-size: 12px; letter-spacing: .26em; text-transform: uppercase;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(120, 170, 255, .18);
    border-top-color: rgba(140, 195, 255, .95);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #err {
    position: fixed; inset: 0; display: none; z-index: 20;
    align-items: center; justify-content: center; padding: 32px;
    text-align: center; color: #ffd7d7; background: #050008; font-size: 14px;
    line-height: 1.7;
  }
  @media (max-width: 640px) {
    #hud { left: 16px; bottom: 16px; font-size: 11px; }
    #stats { display: none; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="hud">
  <b>EARTH</b>
  <span>Drag to orbit &middot; Scroll to zoom &middot; <kbd>Space</kbd> pause spin</span>
</div>
<div id="stats"></div>

<div id="loader">
  <div id="ring"></div>
  <div id="loadmsg">Building planet…</div>
</div>

<div id="err"></div>

/* ══════════════════════════════════════════════════════════════════════
   2.  Procedural noise (3-D value noise → seamless on a sphere)
   ══════════════════════════════════════════════════════════════════════ */

function hash3(i, j, k) {
  let n = (Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1274126177)) | 0;
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177) | 0;
  n = (n ^ (n >>> 16)) >>> 0;
  return n / 4294967295;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf), w = zf*zf*(3-2*zf);
  const c000 = hash3(xi,   yi,   zi  ), c100 = hash3(xi+1, yi,   zi  );
  const c010 = hash3(xi,   yi+1, zi  ), c110 = hash3(xi+1, yi+1, zi  );
  const c001 = hash3(xi,   yi,   zi+1), c101 = hash3(xi+1, yi,   zi+1);
  const c011 = hash3(xi,   yi+1, zi+1), c111 = hash3(xi+1, yi+1, zi+1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}
function fbm(x, y, z, oct, gain) {
  let a = 0.5, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * vnoise(x*f, y*f, z*f);
    n += a; a *= (gain || 0.5); f *= 2.03;
  }
  return s / n;
}

/* ══════════════════════════════════════════════════════════════════════
   3.  Texture painting (equirectangular canvases)
   ══════════════════════════════════════════════════════════════════════ */

const D2R = Math.PI / 180;
const lonToX = (lon, W) => (lon + 180) / 360 * W;
const latToY = (lat, H) => (90 - lat) / 180 * H;

function newCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

/* Build one Path2D holding every landmass, repeated at ±360° so shapes
   that straddle the antimeridian close correctly. */
function buildLandPath(W, H) {
  const p = new Path2D();
  for (const key in LAND) addPoly(p, LAND[key], W, H);
  return p;
}
function addPoly(path, pts, W, H) {
  for (let rep = -1; rep <= 1; rep++) {
    const dx = rep * W;
    path.moveTo(lonToX(pts[0], W) + dx, latToY(pts[1], H));
    for (let i = 2; i < pts.length; i += 2) {
      path.lineTo(lonToX(pts[i], W) + dx, latToY(pts[i+1], H));
    }
    path.closePath();
  }
}
function polyPath(pts, W, H) {
  const p = new Path2D();
  addPoly(p, pts, W, H);
  return p;
}

/* ---- Land mask + elevation (R = land, G = height) ------------------- */
function buildMask(W, H) {
  const cv = newCanvas(W, H);
  const g = cv.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff"; g.fill(buildLandPath(W, H));

  const src = g.getImageData(0, 0, W, H).data;
  const out = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) {
    const lat = (90 - (y + .5) / H * 180) * D2R;
    const cy = Math.cos(lat), sy = Math.sin(lat);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x);
      const land = src[i * 4] / 255;
      let h = 0;
      if (land > .02) {
        const lon = ((x + .5) / W * 360 - 180) * D2R;
        const dx = cy * Math.sin(lon), dy = sy, dz = cy * Math.cos(lon);
        const ridge = 1 - Math.abs(2 * fbm(dx*7+11, dy*7+3, dz*7+7, 3, .5) - 1);
        const base = fbm(dx*3.1+41, dy*3.1+17, dz*3.1+29, 4, .55);
        h = .25 + .45 * base + .40 * ridge * ridge;
      }
      out[i*4]   = Math.round(land * 255);
      out[i*4+1] = Math.round(Math.min(1, h) * 255);
      out[i*4+2] = 0;
      out[i*4+3] = 255;
    }
  }
  return { pixels: out, maskCanvas: cv, maskData: src, W: W, H: H };
}

/* ---- Daylight colour map ------------------------------------------- */
function buildDay(W, H, mask) {
  const cv = newCanvas(W, H);
  const g = cv.getContext("2d");
  const land = buildLandPath(W, H);

  /* deep ocean */
  const og = g.createLinearGradient(0, 0, 0, H);
  og.addColorStop(0.00, "#0a2138");
  og.addColorStop(0.14, "#0b2b46");
  og.addColorStop(0.34, "#0a2b4d");
  og.addColorStop(0.50, "#0a2f57");
  og.addColorStop(0.66, "#0a2c50");
  og.addColorStop(0.86, "#0a2740");
  og.addColorStop(1.00, "#0d2b3c");
  g.fillStyle = og; g.fillRect(0, 0, W, H);

  /* continental shelves — successive strokes just outside the coast */
  g.lineJoin = "round"; g.lineCap = "round";
  const shelf = [[26, "rgba(28,92,140,0.30)"], [16, "rgba(38,116,164,0.34)"],
                 [9, "rgba(52,140,182,0.36)"], [4, "rgba(74,166,198,0.38)"]];
  for (const s of shelf) { g.lineWidth = s[0]; g.strokeStyle = s[1]; g.stroke(land); }

  /* latitude biome bands */
  const bg = g.createLinearGradient(0, 0, 0, H);
  const band = [
    [ 90, "#eef3f7"], [ 75, "#e2eaf0"], [ 70, "#c9cec6"], [ 63, "#6b7355"],
    [ 55, "#3d5630"], [ 46, "#40592f"], [ 38, "#5f6b39"], [ 30, "#9b8b58"],
    [ 24, "#c0a870"], [ 16, "#9e9457"], [  8, "#3d6b2c"], [  0, "#2f5f25"],
    [-10, "#3a6b28"], [-20, "#9a8b55"], [-28, "#a3925c"], [-36, "#6d7440"],
    [-46, "#4a6135"], [-56, "#8d9186"], [-64, "#dfe6ea"], [-90, "#f2f6f9"]
  ];
  for (const b of band) bg.addColorStop(Math.min(1, Math.max(0, (90 - b[0]) / 180)), b[1]);

  g.save();
  g.clip(land);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  /* biome patches */
  for (const b of BIOMES) {
    const r = b[2] / 180 * H;
    for (let rep = -1; rep <= 1; rep++) {
      const cx = lonToX(b[0], W) + rep * W, cy = latToY(b[1], H);
      if (cx < -r || cx > W + r) continue;
      const rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
      const col = b[3];
      rg.addColorStop(0, hexA(col, b[4]));
      rg.addColorStop(0.55, hexA(col, b[4] * 0.55));
      rg.addColorStop(1, hexA(col, 0));
      g.fillStyle = rg;
      g.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
  }
  g.restore();

  /* permanent ice */
  for (const key of ICE_SHEETS) {
    const p = polyPath(LAND[key], W, H);
    g.fillStyle = "rgba(240,246,250,0.94)";
    g.fill(p);
  }

  /* per-pixel detail: terrain mottling on land, subtle swell on water */
  const img = g.getImageData(0, 0, W, H);
  const px = img.data;
  const mw = mask.W, mh = mask.H, md = mask.maskData;
  for (let y = 0; y < H; y++) {
    const latDeg = 90 - (y + .5) / H * 180;
    const lat = latDeg * D2R;
    const cy = Math.cos(lat), sy = Math.sin(lat);
    const my = Math.min(mh - 1, (y * mh / H) | 0);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const mx = Math.min(mw - 1, (x * mw / W) | 0);
      const isLand = md[(my * mw + mx) * 4] > 127;
      const lon = ((x + .5) / W * 360 - 180) * D2R;
      const dx = cy * Math.sin(lon), dy = sy, dz = cy * Math.cos(lon);
      let f;
      if (isLand) {
        f = fbm(dx*13+5, dy*13+2, dz*13+9, 3, .55);
        const k = 0.78 + 0.44 * f;
        px[i]   = Math.min(255, px[i]   * k);
        px[i+1] = Math.min(255, px[i+1] * k);
        px[i+2] = Math.min(255, px[i+2] * k);
      } else {
        f = fbm(dx*6+31, dy*6+13, dz*6+3, 2, .5);
        const k = 0.90 + 0.20 * f;
        px[i]   = Math.min(255, px[i]   * k);
        px[i+1] = Math.min(255, px[i+1] * k);
        px[i+2] = Math.min(255, px[i+2] * k * 1.02);
      }
    }
  }
  g.putImageData(img, 0, 0);
  return cv;
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a.toFixed(3) + ")";
}

/* ---- City lights ---------------------------------------------------- */
function buildNight(W, H, mask) {
  const cv = newCanvas(W, H);
  const g = cv.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "lighter";

  const glow = (lon, lat, radDeg, amp, warm) => {
    const r = Math.max(1.2, radDeg / 180 * H);
    for (let rep = -1; rep <= 1; rep++) {
      const cx = lonToX(lon, W) + rep * W, cy = latToY(lat, H);
      if (cx < -r || cx > W + r) continue;
      const rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
      rg.addColorStop(0.0, "rgba(255," + (238 - warm * 30) + "," + (196 - warm * 60) + "," + amp + ")");
      rg.addColorStop(0.35, "rgba(255," + (206 - warm * 40) + "," + (140 - warm * 50) + "," + (amp * .40) + ")");
      rg.addColorStop(1.0, "rgba(255,150,60,0)");
      g.fillStyle = rg;
      g.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
  };

  for (const c of CITIES) {
    glow(c[0], c[1], 1.0 + 2.6 * c[2], 0.30 + 0.55 * c[2], .3);
    glow(c[0], c[1], 0.35 + 0.7 * c[2], 0.55 + 0.45 * c[2], 0);
  }

  /* scattered towns, biased toward inhabited regions */
  const mw = mask.W, mh = mask.H, md = mask.maskData;
  let placed = 0, tries = 0;
  while (placed < 5200 && tries < 90000) {
    tries++;
    const lon = Math.random() * 360 - 180;
    const lat = Math.asin(Math.random() * 2 - 1) / Math.PI * 180;
    const mx = Math.min(mw - 1, ((lon + 180) / 360 * mw) | 0);
    const my = Math.min(mh - 1, ((90 - lat) / 180 * mh) | 0);
    if (md[(my * mw + mx) * 4] < 128) continue;
    let w = 0;
    for (const p of POP) {
      let dl = Math.abs(lon - p[0]); if (dl > 180) dl = 360 - dl;
      const d = Math.hypot(dl * Math.cos(lat * D2R), lat - p[1]);
      if (d < p[2]) w = Math.max(w, p[3] * (1 - d / p[2]));
    }
    if (w < 0.03 || Math.random() > w) continue;
    placed++;
    const s = 0.20 + Math.random() * 0.55;
    glow(lon, lat, s * 1.9, 0.10 + 0.30 * w, .5);
  }
  return cv;
}

/* ---- Clouds --------------------------------------------------------- */
function buildClouds(W, H) {
  const cv = newCanvas(W, H);
  const g = cv.getContext("2d");
  const img = g.createImageData(W, H);
  const px = img.data;
  for (let y = 0; y < H; y++) {
    const latDeg = 90 - (y + .5) / H * 180;
    const lat = latDeg * D2R;
    const cy = Math.cos(lat), sy = Math.sin(lat);
    const al = Math.abs(latDeg);
    const itcz  =  0.30 * Math.exp(-Math.pow((latDeg - 4) / 9, 2));
    const dry   = -0.26 * Math.exp(-Math.pow((al - 27) / 12, 2));
    const midla =  0.22 * Math.exp(-Math.pow((al - 57) / 15, 2));
    const polar = -0.05 * Math.exp(-Math.pow((al - 90) / 14, 2));
    const bias = itcz + dry + midla + polar;
    for (let x = 0; x < W; x++) {
      const lon = ((x + .5) / W * 360 - 180) * D2R;
      const dx = cy * Math.sin(lon), dy = sy, dz = cy * Math.cos(lon);
      /* domain warp keeps the bands wispy rather than blobby */
      const wx = fbm(dx*2.0+70, dy*4.4+12, dz*2.0+33, 2, .5) - .5;
      const wz = fbm(dx*2.0+13, dy*4.4+91, dz*2.0+55, 2, .5) - .5;
      const s = 2.6;
      const n = fbm(dx*s + wx*1.1, dy*s*2.7 + wz*1.1, dz*s + wz*0.9, 5, .55);
      let a = (n + bias - 0.44) / 0.22;
      a = a < 0 ? 0 : a > 1 ? 1 : a;
      a = a * a * (3 - 2 * a);
      const i = (y * W + x) * 4;
      px[i] = px[i+1] = px[i+2] = 255;
      px[i+3] = Math.round(a * 235);
    }
  }
  g.putImageData(img, 0, 0);
  return cv;
}

/* ══════════════════════════════════════════════════════════════════════
   4.  WebGL setup
   ══════════════════════════════════════════════════════════════════════ */

const canvas = document.getElementById("gl");
const errBox = document.getElementById("err");
function fail(msg) {
  errBox.style.display = "flex";
  errBox.textContent = msg;
  const l = document.getElementById("loader");
  if (l) l.classList.add("hidden");
}

let gl = null;
try {
  const opts = { antialias: true, alpha: false, depth: true,
                 premultipliedAlpha: false, powerPreference: "high-performance" };
  gl = canvas.getContext("webgl", opts) || canvas.getContext("experimental-webgl", opts);
} catch (e) { /* handled below */ }
if (!gl) {
  fail("This page needs WebGL, which your browser has disabled or does not support. Try a recent version of Chrome, Firefox, Edge or Safari with hardware acceleration enabled.");
  return;
}

const anisoExt = gl.getExtension("EXT_texture_filter_anisotropic") ||
                 gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic");
const maxAniso = anisoExt ? gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s) + "\n" + src);
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  /* cache locations */
  p.u = {}; p.a = {};
  const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < nu; i++) {
    const info = gl.getActiveUniform(p, i);
    const nm = info.name.replace(/\[0\]$/, "");
    p.u[nm] = gl.getUniformLocation(p, nm);
  }
  const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
  for (let i = 0; i < na; i++) {
    const info = gl.getActiveAttrib(p, i);
    p.a[info.name] = gl.getAttribLocation(p, info.name);
  }
  return p;
}

const PREC = "#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n";

/* ---- Geometry -------------------------------------------------------- */
function makeSphere(segX, segY) {
  const pos = [], uv = [], idx = [];
  for (let y = 0; y <= segY; y++) {
    const v = y / segY, phi = v * Math.PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let x = 0; x <= segX; x++) {
      const u = x / segX, lon = (u * 360 - 180) * D2R;
      pos.push(sp * Math.sin(lon), cp, sp * Math.cos(lon));
      uv.push(u, v);
    }
  }
  const row = segX + 1;
  for (let y = 0; y < segY; y++) {
    for (let x = 0; x < segX; x++) {
      const a = y * row + x, b = a + row;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  const buf = {
    pos: gl.createBuffer(), uv: gl.createBuffer(), idx: gl.createBuffer(),
    count: idx.length
  };
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.pos);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.uv);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uv), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buf.idx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  return buf;
}

function bindSphere(p, sph) {
  gl.bindBuffer(gl.ARRAY_BUFFER, sph.pos);
  gl.enableVertexAttribArray(p.a.aPos);
  gl.vertexAttribPointer(p.a.aPos, 3, gl.FLOAT, false, 0, 0);
  if (p.a.aUv !== undefined && p.a.aUv >= 0) {
    gl.bindBuffer(gl.ARRAY_BUFFER, sph.uv);
    gl.enableVertexAttribArray(p.a.aUv);
    gl.vertexAttribPointer(p.a.aUv, 2, gl.FLOAT, false, 0, 0);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sph.idx);
}

/* ---- Textures -------------------------------------------------------- */
function texFromCanvas(cv, wrapS) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  finishTex(wrapS);
  return t;
}
function texFromPixels(pixels, w, h, wrapS) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  finishTex(wrapS);
  return t;
}
function finishTex(wrapS) {
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrapS || gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  if (anisoExt) {
    gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, maxAniso));
  }
}

/* ══════════════════════════════════════════════════════════════════════
   5.  Shaders
   ══════════════════════════════════════════════════════════════════════ */

const VS_SPHERE = `
attribute vec3 aPos;
attribute vec2 aUv;
uniform mat4 uProj, uView, uModel;
uniform mat3 uNrm;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vW;
void main() {
  vUv = aUv;
  vN = normalize(uNrm * aPos);
  vec4 w = uModel * vec4(aPos, 1.0);
  vW = w.xyz;
  gl_Position = uProj * uView * w;
}`;

const FS_EARTH = PREC + `
uniform sampler2D uDay, uNight, uMask;
uniform vec3 uSun, uCam;
uniform vec2 uTexel;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vW;

void main() {
  vec3 N = normalize(vN);
  vec3 V = normalize(uCam - vW);
  vec3 L = normalize(uSun);

  vec4 m  = texture2D(uMask, vUv);
  float land = m.r;

  /* --- relief: perturb the normal with the height gradient --- */
  float hL = texture2D(uMask, vUv - vec2(uTexel.x, 0.0)).g;
  float hR = texture2D(uMask, vUv + vec2(uTexel.x, 0.0)).g;
  float hD = texture2D(uMask, vUv - vec2(0.0, uTexel.y)).g;
  float hU = texture2D(uMask, vUv + vec2(0.0, uTexel.y)).g;
  vec3 up = abs(N.y) > 0.995 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
  vec3 T = normalize(cross(up, N));
  vec3 B = cross(N, T);
  vec3 Nb = normalize(N + (T * (hL - hR) + B * (hU - hD)) * 2.2 * land);

  float ndlGeo = dot(N, L);
  float dayF = smoothstep(-0.14, 0.22, ndlGeo);
  float diff = max(dot(Nb, L), 0.0);
  diff = mix(diff, max(ndlGeo, 0.0), 0.35);

  /* warm sunlight near the terminator, neutral at high sun */
  vec3 sunCol = mix(vec3(1.00, 0.42, 0.16), vec3(1.0, 0.975, 0.93),
                    smoothstep(-0.02, 0.34, ndlGeo));

  vec3 base = texture2D(uDay, vUv).rgb;

  /* ocean specular highlight */
  vec3 H = normalize(L + V);
  float sp = pow(max(dot(Nb, H), 0.0), 110.0);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 5.0);
  vec3 spec = sunCol * sp * (1.0 - land) * (0.55 + 2.6 * fres) * dayF;

  /* city lights on the dark hemisphere */
  vec3 lights = texture2D(uNight, vUv).rgb * pow(1.0 - dayF, 1.6) * 1.35;

  vec3 col = base * (0.030 + 1.16 * diff * dayF) * sunCol;
  col += spec;
  col += lights;

  /* limb haze on the sunlit side */
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  col += vec3(0.26, 0.47, 0.95) * rim * dayF * 0.55;
  col += vec3(0.55, 0.30, 0.12) * rim *
         (1.0 - smoothstep(0.0, 0.30, abs(ndlGeo))) * 0.45;

  /* faint night-side earthshine so the globe never goes fully black */
  col += vec3(0.014, 0.021, 0.040) * (1.0 - dayF);

  gl_FragColor = vec4(col, 1.0);
}`;

const FS_CLOUD = PREC + `
uniform sampler2D uCloud;
uniform vec3 uSun, uCam;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vW;
void main() {
  vec3 N = normalize(vN);
  vec3 V = normalize(uCam - vW);
  vec3 L = normalize(uSun);
  float a = texture2D(uCloud, vUv).a;
  if (a < 0.004) discard;
  float ndl = dot(N, L);
  float dayF = smoothstep(-0.16, 0.24, ndl);
  vec3 tint = mix(vec3(1.0, 0.46, 0.20), vec3(1.0), smoothstep(-0.02, 0.32, ndl));
  vec3 c = tint * (0.035 + 1.05 * max(ndl, 0.0) * dayF);
  c += vec3(0.03, 0.05, 0.09) * (1.0 - dayF);
  float edge = smoothstep(0.0, 0.30, dot(N, V));
  gl_FragColor = vec4(c, a * 0.92 * mix(0.55, 1.0, edge));
}`;

const FS_ATMO = PREC + `
uniform vec3 uSun, uCam;
varying vec3 vW;
void main() {
  vec3 ro = uCam;
  vec3 rd = normalize(vW - ro);
  vec3 L = normalize(uSun);

  float tca = -dot(ro, rd);
  float d2 = max(dot(ro, ro) - tca * tca, 0.0);
  const float Ra = 1.155, Re = 1.0;
  float ra2 = Ra * Ra;
  if (d2 > ra2) discard;

  float half_a = sqrt(ra2 - d2);
  float half_e = d2 < Re * Re ? sqrt(Re * Re - d2) : 0.0;
  float thick = d2 < Re * Re ? (half_a - half_e) : 2.0 * half_a;

  float glow = 1.0 - exp(-thick * 3.1);

  vec3 P = normalize(ro + rd * tca);
  float sun = dot(P, L);
  float lit = smoothstep(-0.45, 0.30, sun);
  float term = 1.0 - smoothstep(0.0, 0.42, abs(sun));

  vec3 blue = vec3(0.30, 0.56, 1.0);
  vec3 warm = vec3(1.0, 0.46, 0.20);
  vec3 col = mix(blue, warm, term * 0.62) * glow * (0.10 + 1.30 * lit);

  /* forward scattering makes the day limb noticeably brighter */
  float fwd = pow(max(dot(rd, L), 0.0), 6.0);
  col += blue * glow * fwd * 0.35;

  gl_FragColor = vec4(col, 1.0);
}`;

const VS_STARS = `
attribute vec3 aPos;
attribute vec2 aMeta;      // x = size, y = twinkle phase
attribute vec3 aCol;
uniform mat4 uProj, uView;
uniform float uScale, uTime;
varying vec3 vCol;
varying float vTw;
void main() {
  gl_Position = uProj * uView * vec4(aPos, 1.0);
  gl_PointSize = max(1.0, aMeta.x * uScale);
  vTw = 0.78 + 0.22 * sin(uTime * 1.7 + aMeta.y * 6.2831);
  vCol = aCol;
}`;

const FS_STARS = PREC + `
varying vec3 vCol;
varying float vTw;
void main() {
  vec2 p = gl_PointCoord - 0.5;
  float d = length(p);
  float a = smoothstep(0.5, 0.06, d);
  a *= a;
  gl_FragColor = vec4(vCol * a * vTw, 1.0);
}`;

const VS_SUN = `
attribute vec3 aPos;
uniform mat4 uProj, uView;
uniform float uSize;
void main() {
  gl_Position = uProj * uView * vec4(aPos, 1.0);
  gl_PointSize = uSize;
}`;

const FS_SUN = PREC + `
void main() {
  vec2 p = gl_PointCoord - 0.5;
  float d = length(p) * 2.0;
  float core = smoothstep(0.30, 0.0, d);
  float halo = pow(smoothstep(1.0, 0.0, d), 3.0);
  vec3 c = vec3(1.0, 0.96, 0.88) * core + vec3(1.0, 0.80, 0.50) * halo * 0.55;
  gl_FragColor = vec4(c, 1.0);
}`;

/* ══════════════════════════════════════════════════════════════════════
   6.  Build everything, then run
   ══════════════════════════════════════════════════════════════════════ */

let progEarth, progCloud, progAtmo, progStars, progSun;
let sphereHi, sphereLo, sphereAtmo;
let texDay, texNight, texMask, texCloud;
let starBuf, starCount, sunBuf;
let maskTexel = [1 / 1024, 1 / 512];

const state = {
  yaw: -0.55, pitch: 0.34, dist: 3.15, targetDist: 3.15,
  spin: 0, spinning: true, dragging: false, lx: 0, ly: 0,
  time: 0, fps: 0, ready: false
};
const SUN_DIR = norm3([1.0, 0.16, 0.30]);
const TILT = 23.44 * D2R;

function makeStars() {
  const N = 3200;
  const pos = new Float32Array(N * 3);
  const meta = new Float32Array(N * 2);
  const col = new Float32Array(N * 3);
  const R = 90;
  /* galactic band basis */
  const bn = norm3([0.32, 0.86, -0.40]);
  const ba = norm3([bn[1], -bn[0], 0]);
  const bb = [bn[1]*ba[2]-bn[2]*ba[1], bn[2]*ba[0]-bn[0]*ba[2], bn[0]*ba[1]-bn[1]*ba[0]];
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i % 5 < 2) {                       // ~40 % clustered into a milky band
      const t = Math.random() * Math.PI * 2;
      const off = (Math.random() + Math.random() + Math.random() - 1.5) * 0.30;
      x = ba[0]*Math.cos(t) + bb[0]*Math.sin(t) + bn[0]*off;
      y = ba[1]*Math.cos(t) + bb[1]*Math.sin(t) + bn[1]*off;
      z = ba[2]*Math.cos(t) + bb[2]*Math.sin(t) + bn[2]*off;
      const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
    } else {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      x = s * Math.cos(th); y = u; z = s * Math.sin(th);
    }
    pos[i*3] = x * R; pos[i*3+1] = y * R; pos[i*3+2] = z * R;

    const r = Math.random();
    const mag = r < 0.008 ? 2.9 : r < 0.05 ? 1.9 : r < 0.28 ? 1.35 : 0.95;
    meta[i*2] = mag; meta[i*2+1] = Math.random();

    const t = Math.random();
    let cr, cg, cb;
    if (t < 0.18)      { cr = 0.72; cg = 0.80; cb = 1.00; }   // blue-white
    else if (t < 0.55) { cr = 0.95; cg = 0.96; cb = 1.00; }   // white
    else if (t < 0.82) { cr = 1.00; cg = 0.94; cb = 0.80; }   // yellow
    else               { cr = 1.00; cg = 0.78; cb = 0.62; }   // orange
    const b = 0.42 + Math.random() * 0.58;
    col[i*3] = cr * b; col[i*3+1] = cg * b; col[i*3+2] = cb * b;
  }
  const mk = (data) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return b;
  };
  starCount = N;
  starBuf = { pos: mk(pos), meta: mk(meta), col: mk(col) };

  const sp = new Float32Array([SUN_DIR[0]*80, SUN_DIR[1]*80, SUN_DIR[2]*80]);
  sunBuf = mk(sp);
}

/* --- staged construction so the loader keeps animating --------------- */
const loader = document.getElementById("loader");
const loadmsg = document.getElementById("loadmsg");
let maskInfo = null;

const steps = [
  ["Mapping coastlines…", () => {
    maskInfo = buildMask(1024, 512);
    texMask = texFromPixels(maskInfo.pixels, maskInfo.W, maskInfo.H);
    maskTexel = [1 / maskInfo.W, 1 / maskInfo.H];
  }],
  ["Painting continents…", () => {
    texDay = texFromCanvas(buildDay(2048, 1024, maskInfo));
  }],
  ["Lighting the cities…", () => {
    texNight = texFromCanvas(buildNight(1024, 512, maskInfo));
  }],
  ["Forming the atmosphere…", () => {
    texCloud = texFromCanvas(buildClouds(1024, 512));
  }],
  ["Igniting the stars…", () => {
    progEarth = program(VS_SPHERE, FS_EARTH);
    progCloud = program(VS_SPHERE, FS_CLOUD);
    progAtmo  = program(VS_SPHERE, FS_ATMO);
    progStars = program(VS_STARS, FS_STARS);
    progSun   = program(VS_SUN, FS_SUN);
    sphereHi   = makeSphere(160, 80);
    sphereLo   = makeSphere(96, 48);
    sphereAtmo = makeSphere(64, 32);
    makeStars();
  }]
];

let stepIdx = 0;
function runStep() {
  if (stepIdx >= steps.length) {
    state.ready = true;
    loader.classList.add("hidden");
    setTimeout(() => loader.remove(), 900);
    requestAnimationFrame(frame);
    return;
  }
  const s = steps[stepIdx++];
  loadmsg.textContent = s[0];
  setTimeout(() => {
    try { s[1](); } catch (e) { fail("Could not initialise the renderer: " + e.message); return; }
    runStep();
  }, 24);
}
setTimeout(runStep, 60);

/* ══════════════════════════════════════════════════════════════════════
   7.  Interaction
   ══════════════════════════════════════════════════════════════════════ */

function pointerDown(e) {
  state.dragging = true;
  canvas.classList.add("dragging");
  state.lx = e.clientX; state.ly = e.clientY;
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }
}
function pointerMove(e) {
  if (!state.dragging) return;
  const dx = e.clientX - state.lx, dy = e.clientY - state.ly;
  state.lx = e.clientX; state.ly = e.clientY;
  state.yaw   -= dx * 0.005;
  state.pitch += dy * 0.005;
  const lim = Math.PI / 2 - 0.02;
  state.pitch = Math.max(-lim, Math.min(lim, state.pitch));
}
function pointerUp() { state.dragging = false; canvas.classList.remove("dragging"); }

canvas.addEventListener("pointerdown", pointerDown);
window.addEventListener("pointermove", pointerMove);
window.addEventListener("pointerup", pointerUp);
window.addEventListener("pointercancel", pointerUp);

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const k = Math.exp((e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * 0.0011);
  state.targetDist = Math.max(1.35, Math.min(9.0, state.targetDist * k));
}, { passive: false });

/* pinch zoom */
let pinch = 0;
canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });
canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2 && pinch > 0) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    state.targetDist = Math.max(1.35, Math.min(9.0, state.targetDist * (pinch / d)));
    pinch = d;
    e.preventDefault();
  }
}, { passive: false });
canvas.addEventListener("touchend", () => { pinch = 0; }, { passive: true });

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); state.spinning = !state.spinning; }
});

/* ══════════════════════════════════════════════════════════════════════
   8.  Render loop
   ══════════════════════════════════════════════════════════════════════ */

const proj = m4(), view = m4(), model = m4(), tmpA = m4(), tmpB = m4();
const nrm = new Float32Array(9);
const statsEl = document.getElementById("stats");
let lastT = 0, fpsAcc = 0, fpsN = 0, fpsTimer = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
  return dpr;
}

function frame(t) {
  requestAnimationFrame(frame);
  if (!state.ready) return;

  const now = t * 0.001;
  let dt = lastT ? now - lastT : 0.016;
  lastT = now;
  dt = Math.min(dt, 0.1);
  state.time += dt;

  if (state.spinning) state.spin += dt * 0.055;
  state.dist += (state.targetDist - state.dist) * Math.min(1, dt * 6);

  const dpr = resize();
  const W = canvas.width, H = canvas.height;
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0.008, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const fov = 42 * D2R;
  m4perspective(proj, fov, W / H, 0.02, 300);

  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const eye = [
    state.dist * cp * Math.sin(state.yaw),
    state.dist * sp,
    state.dist * cp * Math.cos(state.yaw)
  ];
  m4lookAt(view, eye, [0, 0, 0], [0, 1, 0]);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  /* ---------- stars ---------- */
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.disable(gl.CULL_FACE);

  gl.useProgram(progStars);
  gl.uniformMatrix4fv(progStars.u.uProj, false, proj);
  gl.uniformMatrix4fv(progStars.u.uView, false, view);
  gl.uniform1f(progStars.u.uScale, dpr);
  gl.uniform1f(progStars.u.uTime, state.time);
  gl.bindBuffer(gl.ARRAY_BUFFER, starBuf.pos);
  gl.enableVertexAttribArray(progStars.a.aPos);
  gl.vertexAttribPointer(progStars.a.aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, starBuf.meta);
  gl.enableVertexAttribArray(progStars.a.aMeta);
  gl.vertexAttribPointer(progStars.a.aMeta, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, starBuf.col);
  gl.enableVertexAttribArray(progStars.a.aCol);
  gl.vertexAttribPointer(progStars.a.aCol, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.POINTS, 0, starCount);
  gl.disableVertexAttribArray(progStars.a.aMeta);
  gl.disableVertexAttribArray(progStars.a.aCol);

  /* ---------- distant sun ---------- */
  gl.useProgram(progSun);
  gl.uniformMatrix4fv(progSun.u.uProj, false, proj);
  gl.uniformMatrix4fv(progSun.u.uView, false, view);
  gl.uniform1f(progSun.u.uSize, Math.min(150, 46 * dpr));
  gl.bindBuffer(gl.ARRAY_BUFFER, sunBuf);
  gl.enableVertexAttribArray(progSun.a.aPos);
  gl.vertexAttribPointer(progSun.a.aPos, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.POINTS, 0, 1);

  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);

  /* ---------- planet ---------- */
  m4rotZ(tmpA, -TILT);
  m4rotY(tmpB, state.spin);
  m4mul(model, tmpA, tmpB);
  m3from4(nrm, model);

  gl.useProgram(progEarth);
  gl.uniformMatrix4fv(progEarth.u.uProj, false, proj);
  gl.uniformMatrix4fv(progEarth.u.uView, false, view);
  gl.uniformMatrix4fv(progEarth.u.uModel, false, model);
  gl.uniformMatrix3fv(progEarth.u.uNrm, false, nrm);
  gl.uniform3fv(progEarth.u.uSun, SUN_DIR);
  gl.uniform3fv(progEarth.u.uCam, eye);
  gl.uniform2fv(progEarth.u.uTexel, maskTexel);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texDay);
  gl.uniform1i(progEarth.u.uDay, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texNight);
  gl.uniform1i(progEarth.u.uNight, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.uniform1i(progEarth.u.uMask, 2);
  bindSphere(progEarth, sphereHi);
  gl.drawElements(gl.TRIANGLES, sphereHi.count, gl.UNSIGNED_SHORT, 0);

  /* ---------- clouds ---------- */
  m4rotY(tmpB, state.spin * 1.045 + 0.4);
  m4mul(model, tmpA, tmpB);
  m4scale(tmpB, 1.0075);
  m4mul(model, model, tmpB);
  m3from4(nrm, model);

  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(progCloud);
  gl.uniformMatrix4fv(progCloud.u.uProj, false, proj);
  gl.uniformMatrix4fv(progCloud.u.uView, false, view);
  gl.uniformMatrix4fv(progCloud.u.uModel, false, model);
  gl.uniformMatrix3fv(progCloud.u.uNrm, false, nrm);
  gl.uniform3fv(progCloud.u.uSun, SUN_DIR);
  gl.uniform3fv(progCloud.u.uCam, eye);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texCloud);
  gl.uniform1i(progCloud.u.uCloud, 0);
  bindSphere(progCloud, sphereLo);
  gl.drawElements(gl.TRIANGLES, sphereLo.count, gl.UNSIGNED_SHORT, 0);

  /* ---------- atmosphere shell ---------- */
  m4scale(model, 1.155);
  m3from4(nrm, model);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.cullFace(gl.FRONT);
  gl.useProgram(progAtmo);
  gl.uniformMatrix4fv(progAtmo.u.uProj, false, proj);
  gl.uniformMatrix4fv(progAtmo.u.uView, false, view);
  gl.uniformMatrix4fv(progAtmo.u.uModel, false, model);
  gl.uniformMatrix3fv(progAtmo.u.uNrm, false, nrm);
  gl.uniform3fv(progAtmo.u.uSun, SUN_DIR);
  gl.uniform3fv(progAtmo.u.uCam, eye);
  bindSphere(progAtmo, sphereAtmo);
  gl.drawElements(gl.TRIANGLES, sphereAtmo.count, gl.UNSIGNED_SHORT, 0);
  gl.cullFace(gl.BACK);

  gl.disable(gl.BLEND);
  gl.depthMask(true);

  /* ---------- readout ---------- */
  fpsAcc += 1 / Math.max(dt, 1e-4); fpsN++; fpsTimer += dt;
  if (fpsTimer > 0.5) {
    const fps = Math.round(fpsAcc / fpsN);
    statsEl.textContent =
      "Altitude " + ((state.dist - 1) * 6371).toFixed(0) + " km · " + fps + " fps";
    fpsAcc = 0; fpsN = 0; fpsTimer = 0;
  }
}

window.addEventListener("resize", resize);

})();
</script>
</body>
</html>
