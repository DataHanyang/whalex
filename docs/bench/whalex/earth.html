<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Earth — 3D Globe</title>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000208;
  }

  #scene-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
  }

  #hud {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 22px;
    text-align: center;
    color: rgba(255, 255, 255, 0.92);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
  }

  #hud h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  #hud p {
    margin: 6px 0 0;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.68);
  }

  #error {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #ffffff;
    background: #05070d;
    z-index: 20;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  #error .box {
    max-width: 520px;
  }

  #error h2 {
    margin: 0 0 10px;
    font-size: 22px;
  }

  #error p {
    margin: 0;
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="scene-container"></div>

  <div id="hud" aria-hidden="true">
    <h1>Earth</h1>
    <p>Continuous rotation &bull; realistic day and night</p>
  </div>

  <div id="error">
    <div class="box">
      <h2>Unable to render Earth</h2>
      <p id="error-message">Your browser may not support WebGL, or the 3D library failed to load.</p>
    </div>
  </div>

  <script>
    function showError(message) {
      var errorEl = document.getElementById('error');
      document.getElementById('error-message').textContent =
        message || 'Your browser may not support WebGL, or the 3D library failed to load.';
      errorEl.style.display = 'flex';
    }

    function createFallbackEarthTexture() {
      var width = 1024;
      var height = 512;
      var canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext('2d');

      var ocean = ctx.createLinearGradient(0, 0, 0, height);
      ocean.addColorStop(0, '#0a2f63');
      ocean.addColorStop(0.5, '#0c3f8c');
      ocean.addColorStop(1, '#0a2f63');
      ctx.fillStyle = ocean;
      ctx.fillRect(0, 0, width, height);

      function blob(x, y, rx, ry, rotation, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation || 0);
        ctx.scale(1, Math.max(0.35, ry / rx));
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Very rough procedural continents, used only while the real texture loads
      // (or if the real texture cannot be fetched).
      var land = '#3b8c46';
      var landDark = '#2f7a3d';
      blob(230, 165, 92, 120, 0.25, land);
      blob(255, 260, 108, 140, -0.35, landDark);
      blob(495, 130, 95, 135, 0.2, land);
      blob(505, 255, 88, 150, 0.4, landDark);
      blob(625, 300, 72, 55, -0.2, land);
      blob(760, 120, 118, 100, 0.15, land);
      blob(785, 230, 100, 135, -0.3, landDark);
      blob(900, 190, 58, 48, 0.5, land);

      var texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.encoding = THREE.sRGBEncoding;
      return texture;
    }

    function createStars() {
      var group = new THREE.Group();
      var layers = [
        { count: 1700, radius: 36, size: 0.55, color: 0xffffff, opacity: 0.82 },
        { count: 620, radius: 39, size: 0.9, color: 0xcfe0ff, opacity: 0.9 },
        { count: 260, radius: 33, size: 1.25, color: 0xffe2b0, opacity: 0.8 }
      ];

      layers.forEach(function (cfg) {
        var positions = new Float32Array(cfg.count * 3);
        var colors = new Float32Array(cfg.count * 3);
        var baseColor = new THREE.Color(cfg.color);

        for (var i = 0; i < cfg.count; i++) {
          var u = Math.random() * 2 - 1;
          var theta = Math.random() * Math.PI * 2;
          var phi = Math.acos(u);
          var radius = cfg.radius + (Math.random() * 1.4 - 0.7);

          positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = radius * Math.cos(phi);

          var tint = 0.7 + Math.random() * 0.3;
          colors[i * 3] = baseColor.r * tint;
          colors[i * 3 + 1] = baseColor.g * tint;
          colors[i * 3 + 2] = baseColor.b * tint;
        }

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        var material = new THREE.PointsMaterial({
          size: cfg.size,
          vertexColors: true,
          transparent: true,
          opacity: cfg.opacity,
          depthWrite: false,
          sizeAttenuation: true
        });

        group.add(new THREE.Points(geometry, material));
      });

      return group;
    }

    function initEarth() {
      try {
        if (!window.THREE) {
          showError('The 3D library could not be loaded.');
          return;
        }

        var container = document.getElementById('scene-container');
        var width = container.clientWidth || window.innerWidth;
        var height = container.clientHeight || window.innerHeight;

        var renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(width, height);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.setClearColor(0x000208, 1);
        container.appendChild(renderer.domElement);

        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000208);

        var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 200);
        camera.position.set(0, 0.18, 2.65);
        camera.lookAt(0, 0, 0);

        // The visible disk is mostly day-lit, with the terminator crossing
        // the left side so the day/night boundary is clearly visible.
        var sunDirection = new THREE.Vector3(2.4, 0.42, 1.55).normalize();

        var sunLight = new THREE.DirectionalLight(0xfff2dd, 2.2);
        sunLight.position.copy(sunDirection).multiplyScalar(15);
        scene.add(sunLight);

        var ambientLight = new THREE.AmbientLight(0x0c1830, 0.85);
        scene.add(ambientLight);

        var nightFill = new THREE.DirectionalLight(0x1f3f7a, 0.22);
        nightFill.position.copy(sunDirection).multiplyScalar(-15);
        scene.add(nightFill);

        var stars = createStars();
        scene.add(stars);

        // Axial tilt (23.4 degrees). The inner group spins around the tilted
        // axis so rotation looks natural instead of spinning perfectly upright.
        var tiltGroup = new THREE.Group();
        tiltGroup.rotation.z = THREE.MathUtils.degToRad(23.4);
        scene.add(tiltGroup);

        var spinGroup = new THREE.Group();
        tiltGroup.add(spinGroup);

        var fallbackTexture = createFallbackEarthTexture();
        var maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
        fallbackTexture.anisotropy = Math.min(8, maxAnisotropy);

        var earthMaterial = new THREE.MeshPhongMaterial({
          map: fallbackTexture,
          color: 0xffffff,
          specular: new THREE.Color(0x111111),
          shininess: 18,
          normalScale: new THREE.Vector2(0.9, 0.9)
        });

        var earthGeometry = new THREE.SphereGeometry(1, 96, 96);
        var earth = new THREE.Mesh(earthGeometry, earthMaterial);
        spinGroup.add(earth);

        // Clouds are hidden until their transparent texture has loaded.
        var cloudMaterial = new THREE.MeshPhongMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.85,
          depthWrite: false,
          visible: false
        });
        var cloudGeometry = new THREE.SphereGeometry(1.012, 96, 96);
        var clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        spinGroup.add(clouds);

        // City lights fade in on the dark side only.
        var nightUniforms = {
          uNightTexture: { value: null },
          uSunDirection: { value: sunDirection.clone() }
        };
        var nightMaterial = new THREE.ShaderMaterial({
          uniforms: nightUniforms,
          vertexShader: [
            'varying vec2 vUv;',
            'varying vec3 vWorldNormal;',
            'void main() {',
            '  vUv = uv;',
            '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
            '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform sampler2D uNightTexture;',
            'uniform vec3 uSunDirection;',
            'varying vec2 vUv;',
            'varying vec3 vWorldNormal;',
            'void main() {',
            '  vec3 normal = normalize(vWorldNormal);',
            '  vec3 sunDir = normalize(uSunDirection);',
            '  float dayAmount = clamp(dot(normal, sunDir), 0.0, 1.0);',
            '  float nightFactor = 1.0 - smoothstep(0.0, 0.38, dayAmount);',
            '  vec3 cityLights = texture2D(uNightTexture, vUv).rgb;',
            '  gl_FragColor = vec4(cityLights * nightFactor, 1.0);',
            '}'
          ].join('\n'),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          visible: false
        });
        var nightGeometry = new THREE.SphereGeometry(1.004, 96, 96);
        var nightLights = new THREE.Mesh(nightGeometry, nightMaterial);
        nightLights.renderOrder = 1;
        spinGroup.add(nightLights);

        // Subtle blue fresnel glow around the rim.
        var atmosphereMaterial = new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: new THREE.Color(0x3d8cff) }
          },
          vertexShader: [
            'varying vec3 vWorldNormal;',
            'varying vec3 vWorldPosition;',
            'void main() {',
            '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
            '  vec4 worldPosition = modelMatrix * vec4(position, 1.0);',
            '  vWorldPosition = worldPosition.xyz;',
            '  gl_Position = projectionMatrix * viewMatrix * worldPosition;',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform vec3 uColor;',
            'varying vec3 vWorldNormal;',
            'varying vec3 vWorldPosition;',
            'void main() {',
            '  vec3 normal = normalize(vWorldNormal);',
            '  vec3 viewDir = normalize(cameraPosition - vWorldPosition);',
            '  float rim = 1.0 - abs(dot(normal, viewDir));',
            '  float intensity = pow(rim, 3.2);',
            '  gl_FragColor = vec4(uColor * intensity, 1.0);',
            '}'
          ].join('\n'),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.FrontSide
        });
        var atmosphereGeometry = new THREE.SphereGeometry(1.16, 96, 96);
        var atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        atmosphere.renderOrder = 3;
        spinGroup.add(atmosphere);

        clouds.renderOrder = 2;

        // Textures.
        var textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
          function (texture) {
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = Math.min(8, maxAnisotropy);
            earthMaterial.map = texture;
            earthMaterial.needsUpdate = true;
          },
          undefined,
          function () {
            console.warn('Earth color texture could not be loaded; using fallback texture.');
          }
        );

        textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
          function (texture) {
            earthMaterial.normalMap = texture;
            earthMaterial.needsUpdate = true;
          },
          undefined,
          function () { console.warn('Earth normal texture could not be loaded.'); }
        );

        textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
          function (texture) {
            earthMaterial.specularMap = texture;
            earthMaterial.specular = new THREE.Color(0xffffff);
            earthMaterial.needsUpdate = true;
          },
          undefined,
          function () { console.warn('Earth specular texture could not be loaded.'); }
        );

        textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
          function (texture) {
            cloudMaterial.map = texture;
            cloudMaterial.visible = true;
            cloudMaterial.needsUpdate = true;
          },
          undefined,
          function () { console.warn('Earth cloud texture could not be loaded.'); }
        );

        textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_lights_2048.png',
          function (texture) {
            texture.encoding = THREE.sRGBEncoding;
            nightUniforms.uNightTexture.value = texture;
            nightMaterial.visible = true;
            nightMaterial.needsUpdate = true;
          },
          undefined,
          function () { console.warn('Earth night-lights texture could not be loaded.'); }
        );

        var clock = new THREE.Clock();
        function animate() {
          requestAnimationFrame(animate);

          var delta = Math.min(clock.getDelta(), 0.1);

          spinGroup.rotation.y += delta * 0.14;
          clouds.rotation.y += delta * 0.028;

          stars.rotation.y += delta * 0.004;
          stars.rotation.x += delta * 0.0012;

          renderer.render(scene, camera);
        }
        animate();

        function onResize() {
          var w = container.clientWidth || window.innerWidth;
          var h = container.clientHeight || window.innerHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }

        window.addEventListener('resize', onResize);
      } catch (err) {
        console.error(err);
        showError('An error occurred while initializing the scene.');
      }
    }

    function fallbackThree() {
      var urls = [
        'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
        'https://unpkg.com/three@0.128.0/build/three.min.js'
      ];
      var index = 0;

      function loadNext() {
        if (index >= urls.length) {
          showError('The 3D library could not be loaded. Check your internet connection and reload the page.');
          return;
        }

        var script = document.createElement('script');
        script.src = urls[index++];
        script.onload = function () {
          if (window.THREE) {
            initEarth();
          } else {
            loadNext();
          }
        };
        script.onerror = loadNext;
        document.head.appendChild(script);
      }

      loadNext();
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
          onload="window.THREE ? initEarth() : fallbackThree()"
          onerror="fallbackThree()"></script>
</body>
</html>
