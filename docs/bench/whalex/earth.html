<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Photorealistic Earth</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000208;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #app canvas {
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #eaf2ff;
      font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
      pointer-events: none;
      transition: opacity 0.7s ease;
      background: radial-gradient(circle at 50% 45%, #0a1226 0%, #000208 70%);
      z-index: 2;
    }

    #overlay.hidden {
      opacity: 0;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: #8fc6ff;
      border-radius: 50%;
      margin-bottom: 18px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #overlay h1 {
      margin: 0;
      font-weight: 300;
      font-size: clamp(20px, 3vw, 34px);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      text-indent: 0.42em;
    }

    #overlay p {
      margin: 0;
      font-size: clamp(11px, 1.4vw, 15px);
      color: #a9c4e8;
      letter-spacing: 0.04em;
    }

    #caption {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      color: rgba(220, 232, 250, 0.55);
      font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease 0.4s;
      z-index: 3;
    }

    #caption.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="overlay">
    <div class="spinner"></div>
    <h1>Earth</h1>
    <p>Loading NASA satellite imagery&hellip;</p>
  </div>

  <div id="caption">Photorealistic Earth &middot; NASA Blue Marble / Black Marble satellite imagery</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('app');
    const overlay = document.getElementById('overlay');
    const caption = document.getElementById('caption');

    // ---- Real NASA satellite-imagery textures (three.js example assets on jsDelivr) ----
    const TEX_BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/';
    const DAY_URL = TEX_BASE + 'earth_atmos_4096.jpg';   // Blue Marble day map
    const NIGHT_URL = TEX_BASE + 'earth_lights_2048.png'; // Black Marble night lights
    const CLOUD_URL = TEX_BASE + 'earth_clouds_1024.png'; // cloud layer (alpha)
    const SPEC_URL = TEX_BASE + 'earth_specular_2048.jpg'; // water / specular mask

    // ---- Renderer, scene, camera ----
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth || window.innerWidth, container.clientHeight || window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000208, 1);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 150);

    // Fixed sun direction in world space (kept constant so the planet rotates under it).
    const sunDir = new THREE.Vector3(1.0, 0.35, 0.55).normalize();

    const FRAME_RADIUS = 1.36; // includes the soft atmospheric halo
    const EARTH_SPEED = 0.060; // radians / second
    const CLOUD_SPEED = 0.072; // slightly faster => clouds drift relative to the surface

    // ---- Star field (procedural background only; the Earth surface is real imagery) ----
    function createStarField() {
      const w = 2048;
      const h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#000104';
      ctx.fillRect(0, 0, w, h);

      const count = 4200;
      for (let i = 0; i < count; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 0.2 + Math.random() * 1.5;
        const alpha = 0.22 + Math.random() * 0.78;
        const t = Math.random();
        let col;
        if (t < 0.10) col = '170, 205, 255';
        else if (t < 0.18) col = '255, 232, 195';
        else if (t < 0.22) col = '255, 210, 210';
        else col = '255, 255, 255';

        ctx.fillStyle = `rgba(${col}, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        if (Math.random() < 0.06) {
          const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
          g.addColorStop(0, `rgba(${col}, ${alpha * 0.55})`);
          g.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r * 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;

      const geo = new THREE.SphereGeometry(60, 64, 64);
      const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = -1;
      return mesh;
    }

    const starMesh = createStarField();
    scene.add(starMesh);

    // ---- Camera framing: always keep the whole sphere + halo visible with margin ----
    function fitCamera() {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;

      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const halfV = fovRad / 2;
      const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
      const halfMin = Math.min(halfV, halfH);

      // Use only 78% of the smaller half-angle so there is clear margin all around.
      const halfAngle = halfMin * 0.78;
      const dist = FRAME_RADIUS / Math.sin(halfAngle);

      camera.position.set(0, 0, dist);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
    }

    fitCamera();

    // ---- Shared GLSL helpers ----
    const SRGB_ENCODE = `
      vec3 srgbEncode(vec3 c) {
        vec3 a = 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055;
        vec3 b = c * 12.92;
        return mix(b, a, step(vec3(0.0031308), c));
      }
    `;

    const EARTH_VERT = `
      varying vec2 vUv;
      varying vec3 vNormalW;
      varying vec3 vWorldPos;

      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        vNormalW = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const EARTH_FRAG = `
      precision highp float;

      uniform sampler2D uDayMap;
      uniform sampler2D uNightMap;
      uniform sampler2D uSpecularMap;
      uniform vec3 uSunDir;
      uniform vec3 uCameraPos;
      uniform float uNightIntensity;
      uniform float uSpecularStrength;
      uniform float uShininess;

      varying vec2 vUv;
      varying vec3 vNormalW;
      varying vec3 vWorldPos;

      ${SRGB_ENCODE}

      void main() {
        vec3 N = normalize(vNormalW);
        vec3 L = normalize(uSunDir);
        vec3 V = normalize(uCameraPos - vWorldPos);

        float NdotL = dot(N, L);

        // Soft, gradual terminator between day and night.
        float dayAmount = smoothstep(-0.22, 0.34, NdotL);

        vec3 dayColor = texture2D(uDayMap, vUv).rgb;
        vec3 nightColor = texture2D(uNightMap, vUv).rgb * uNightIntensity;

        // Gentle limb shading keeps the day side bright and readable everywhere.
        float dayShade = 0.80 + 0.20 * smoothstep(0.0, 0.75, NdotL);
        vec3 base = mix(nightColor, dayColor * dayShade, dayAmount);

        // Very faint Earthshine so the night oceans are not pure black.
        base += dayColor * 0.018 * (1.0 - dayAmount);

        // Subtle, tight ocean sun-glint only (Blinn-Phong, masked to water).
        vec3 H = normalize(L + V);
        float NdotH = max(dot(N, H), 0.0);
        float waterMask = texture2D(uSpecularMap, vUv).r;
        float spec = pow(NdotH, uShininess) * waterMask * uSpecularStrength * dayAmount;
        vec3 sunColor = vec3(1.0, 0.985, 0.94);

        vec3 color = base + sunColor * spec;

        gl_FragColor = vec4(srgbEncode(color), 1.0);
      }
    `;

    const CLOUD_VERT = `
      varying vec2 vUv;
      varying vec3 vNormalW;

      void main() {
        vUv = uv;
        vNormalW = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const CLOUD_FRAG = `
      precision highp float;

      uniform sampler2D uCloudMap;
      uniform vec3 uSunDir;

      varying vec2 vUv;
      varying vec3 vNormalW;

      ${SRGB_ENCODE}

      void main() {
        vec4 tex = texture2D(uCloudMap, vUv);
        float mask = tex.a;

        float NdotL = dot(normalize(vNormalW), normalize(uSunDir));
        float light = smoothstep(-0.10, 0.26, NdotL);

        // Sun-lit clouds fade out smoothly past the terminator.
        float alpha = mask * light * 0.94;
        vec3 color = vec3(0.985, 0.99, 1.0) * (0.80 + 0.20 * light);

        gl_FragColor = vec4(srgbEncode(color), alpha);
      }
    `;

    const ATMO_VERT = `
      varying vec3 vNormalW;
      varying vec3 vWorldPos;

      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        vNormalW = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const ATMO_FRAG = `
      precision highp float;

      uniform vec3 uCameraPos;
      uniform vec3 uSunDir;
      uniform vec3 uColor;
      uniform float uPower;
      uniform float uIntensity;

      varying vec3 vNormalW;
      varying vec3 vWorldPos;

      void main() {
        vec3 N = normalize(vNormalW);
        vec3 V = normalize(uCameraPos - vWorldPos);

        // BackSide far hemisphere: brightest at the planet limb, fading outward.
        float d = dot(N, V);
        float rim = pow(max(0.0, 0.62 - d), uPower);

        // Slightly stronger scattering on the sun-facing limb.
        float sunFacing = clamp(dot(N, normalize(uSunDir)) * 0.5 + 0.5, 0.0, 1.0);
        float dayBoost = 0.32 + 0.68 * sunFacing;

        vec3 color = uColor * (rim * uIntensity * dayBoost);
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // ---- Objects ----
    let earthGroup = null;
    let cloudMesh = null;

    const earthGeometry = new THREE.SphereGeometry(1, 128, 128);
    const cloudGeometry = new THREE.SphereGeometry(1.015, 96, 96);

    function addAtmosphere(radius, color, power, intensity, renderOrder) {
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uCameraPos: { value: camera.position },
          uSunDir: { value: sunDir },
          uColor: { value: color },
          uPower: { value: power },
          uIntensity: { value: intensity }
        },
        vertexShader: ATMO_VERT,
        fragmentShader: ATMO_FRAG,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 96), mat);
      mesh.renderOrder = renderOrder;
      scene.add(mesh);
    }

    function buildEarth(dayTex, nightTex, cloudTex, specTex) {
      const earthMat = new THREE.ShaderMaterial({
        uniforms: {
          uDayMap: { value: dayTex },
          uNightMap: { value: nightTex },
          uSpecularMap: { value: specTex },
          uSunDir: { value: sunDir },
          uCameraPos: { value: camera.position },
          uNightIntensity: { value: 1.6 },
          uSpecularStrength: { value: 0.055 },
          uShininess: { value: 140.0 }
        },
        vertexShader: EARTH_VERT,
        fragmentShader: EARTH_FRAG
      });

      const earthMesh = new THREE.Mesh(earthGeometry, earthMat);
      earthGroup = new THREE.Group();
      earthGroup.add(earthMesh);
      scene.add(earthGroup);

      const cloudMat = new THREE.ShaderMaterial({
        uniforms: {
          uCloudMap: { value: cloudTex },
          uSunDir: { value: sunDir }
        },
        vertexShader: CLOUD_VERT,
        fragmentShader: CLOUD_FRAG,
        transparent: true,
        depthWrite: false
      });

      cloudMesh = new THREE.Mesh(cloudGeometry, cloudMat);
      cloudMesh.renderOrder = 1;
      scene.add(cloudMesh);

      // Thin blue rim glow + a faint outer scattering halo.
      addAtmosphere(1.12, new THREE.Vector3(0.30, 0.58, 1.00), 3.2, 0.85, 2);
      addAtmosphere(1.32, new THREE.Vector3(0.20, 0.42, 0.95), 2.4, 0.22, 2);
    }

    function configureTexture(tex, srgb) {
      tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy() || 1);
      tex.needsUpdate = true;
    }

    function loadTextures() {
      const loader = new THREE.TextureLoader();
      const load = (url, srgb) => new Promise((resolve, reject) => {
        loader.load(url, (tex) => {
          configureTexture(tex, srgb);
          resolve(tex);
        }, undefined, reject);
      });

      return Promise.all([
        load(DAY_URL, true),
        load(NIGHT_URL, true),
        load(CLOUD_URL, true),
        load(SPEC_URL, false)
      ]);
    }

    // ---- Animation loop (runs immediately so the star field is never a blank canvas) ----
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);

      if (earthGroup) earthGroup.rotation.y += EARTH_SPEED * dt;
      if (cloudMesh) cloudMesh.rotation.y += CLOUD_SPEED * dt;
      if (starMesh) starMesh.rotation.y += 0.0015 * dt;

      renderer.render(scene, camera);
    }

    animate();

    // ---- Load the real satellite imagery, then reveal the planet ----
    loadTextures()
      .then(([dayTex, nightTex, cloudTex, specTex]) => {
        buildEarth(dayTex, nightTex, cloudTex, specTex);
        overlay.classList.add('hidden');
        caption.classList.add('visible');
      })
      .catch((err) => {
        console.error('Texture loading failed:', err);
        overlay.querySelector('p').textContent = 'Failed to load Earth textures. Check your connection and reload.';
      });

    // ---- Responsive resize ----
    window.addEventListener('resize', () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      renderer.setSize(w, h);
      fitCamera();
    });
  </script>
</body>
</html>
