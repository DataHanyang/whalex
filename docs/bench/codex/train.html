<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midnight Express</title>
  <style>
    :root {
      color-scheme: dark;
      --cream: #ffd9a1;
      --gold: #ffad36;
      --ember: #ff5b1f;
      --steel: #778393;
      --outline: #080d16;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030811;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .star { animation: twinkle var(--twinkle, 3s) ease-in-out infinite alternate; }
    .cloud-bank { animation: cloudDrift 55s linear infinite; }
    .far-clouds { animation-duration: 80s; animation-direction: reverse; }
    .moon-halo { animation: breathe 5s ease-in-out infinite; }
    .furnace-glow { animation: firePulse .72s ease-in-out infinite alternate; }
    .headlight-beam { animation: beamPulse 2.5s ease-in-out infinite; }
    .rail-shine { animation: railGlint 3.4s linear infinite; }

    .steam-puff {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: puff 3.6s ease-out infinite;
    }

    .steam-puff:nth-child(2) { animation-delay: -.9s; }
    .steam-puff:nth-child(3) { animation-delay: -1.8s; }
    .steam-puff:nth-child(4) { animation-delay: -2.7s; }

    .cylinder-steam {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: cylinderPuff 1.4s ease-out infinite;
    }

    .cylinder-steam:nth-child(2) { animation-delay: -.7s; }

    .spark {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkFly var(--spark-time, .85s) linear infinite;
      animation-delay: var(--spark-delay, 0s);
    }

    .wheel-shine { animation: wheelShine 1.7s ease-in-out infinite alternate; }
    .lamp-core { animation: lampFlicker .18s steps(2, end) infinite; }
    .foreground-mist { animation: mistSlide 20s linear infinite; }

    @keyframes twinkle {
      from { opacity: .18; }
      to { opacity: .95; }
    }

    @keyframes cloudDrift {
      from { transform: translateX(-160px); }
      to { transform: translateX(1700px); }
    }

    @keyframes breathe {
      50% { opacity: .5; transform: scale(1.08); }
    }

    @keyframes firePulse {
      from { opacity: .65; filter: url(#fireGlow); }
      to { opacity: 1; filter: url(#fireGlowStrong); }
    }

    @keyframes beamPulse {
      50% { opacity: .63; }
    }

    @keyframes railGlint {
      0%, 62% { opacity: 0; transform: translateX(-260px); }
      78% { opacity: .75; }
      100% { opacity: 0; transform: translateX(1750px); }
    }

    @keyframes puff {
      0% { opacity: 0; transform: translate(0, 5px) scale(.25); }
      10% { opacity: .72; }
      58% { opacity: .45; }
      100% { opacity: 0; transform: translate(-160px, -170px) scale(2.25); }
    }

    @keyframes cylinderPuff {
      0% { opacity: .6; transform: translate(0, 0) scale(.35); }
      100% { opacity: 0; transform: translate(-90px, 16px) scale(1.8); }
    }

    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      35% { opacity: .95; }
      100% { opacity: 0; transform: translate(var(--spark-x, -110px), var(--spark-y, -70px)) scale(.15); }
    }

    @keyframes wheelShine {
      to { opacity: .72; }
    }

    @keyframes lampFlicker {
      50% { opacity: .78; }
    }

    @keyframes mistSlide {
      from { transform: translateX(-140px); }
      to { transform: translateX(200px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .star, .moon-halo, .furnace-glow, .lamp-core { animation-duration: 8s; }
    }
  </style>
</head>
<body>

      <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">

      <filter id="fireGlowStrong" x="-100%" y="-100%" width="300%" height="300%">

      <filter id="lampGlow" x="-200%" y="-200%" width="500%" height="500%">

  <script>
    (() => {
      'use strict';

      const svg = document.getElementById('scene');
      const stars = document.getElementById('stars');
      const train = document.getElementById('train');
      const mainRod = document.getElementById('mainRod');
      const mainRodShadow = document.getElementById('mainRodShadow');
      const pistonRod = document.getElementById('pistonRod');
      const pistonRodShadow = document.getElementById('pistonRodShadow');
      const pinOne = document.getElementById('pinOne');
      const pinTwo = document.getElementById('pinTwo');
      const wheels = [...document.querySelectorAll('[data-radius]')];
      const NS = 'http://www.w3.org/2000/svg';

      // A deterministic star field keeps the page visually rich without external assets.
      let seed = 48271;
      const random = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 95; i += 1) {
        const star = document.createElementNS(NS, 'circle');
        star.setAttribute('class', 'star');
        star.setAttribute('cx', (25 + random() * 1540).toFixed(1));
        star.setAttribute('cy', (22 + random() * 390).toFixed(1));
        star.setAttribute('r', (0.6 + random() * 1.8).toFixed(1));
        star.style.setProperty('--twinkle', `${(1.8 + random() * 3.8).toFixed(2)}s`);
        star.style.animationDelay = `${(-random() * 4).toFixed(2)}s`;
        stars.appendChild(star);
      }

      const startX = -805;
      const endX = 1680;
      const travel = endX - startX;
      const duration = 12000;
      const driveRadius = 66;
      const phase = -0.35;
      let animationStart;

      const pointOnWheel = (cx, cy, radius, angle) => ({
        x: cx + Math.cos(angle) * radius,
        y: cy + Math.sin(angle) * radius
      });

      const pathBetween = (a, b) => `M${a.x.toFixed(2)} ${a.y.toFixed(2)} L${b.x.toFixed(2)} ${b.y.toFixed(2)}`;

      function animate(now) {
        if (animationStart === undefined) animationStart = now;
        const elapsed = (now - animationStart) % duration;
        const progress = elapsed / duration;
        const trainX = startX + travel * progress;
        const wheelAngle = (travel * progress / driveRadius) + phase;
        const degrees = wheelAngle * 180 / Math.PI;

        train.setAttribute('transform', `translate(${trainX.toFixed(2)} 0)`);

        wheels.forEach((wheel) => {
          const cx = Number(wheel.dataset.cx);
          const cy = Number(wheel.dataset.cy);
          const radius = Number(wheel.dataset.radius);
          const scaledDegrees = degrees * driveRadius / radius;
          wheel.setAttribute('transform', `rotate(${scaledDegrees.toFixed(2)} ${cx} ${cy})`);
        });

        const firstPin = pointOnWheel(338, 674, 43, wheelAngle);
        const secondPin = pointOnWheel(500, 674, 43, wheelAngle);
        const mainPath = pathBetween(firstPin, secondPin);
        const pistonAnchor = { x: 628 + Math.cos(wheelAngle) * 24, y: 632 };
        const pistonPath = pathBetween(secondPin, pistonAnchor);

        mainRod.setAttribute('d', mainPath);
        mainRodShadow.setAttribute('d', mainPath);
        pistonRod.setAttribute('d', pistonPath);
        pistonRodShadow.setAttribute('d', pistonPath);
        pinOne.setAttribute('cx', firstPin.x.toFixed(2));
        pinOne.setAttribute('cy', firstPin.y.toFixed(2));
        pinTwo.setAttribute('cx', secondPin.x.toFixed(2));
        pinTwo.setAttribute('cy', secondPin.y.toFixed(2));

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
